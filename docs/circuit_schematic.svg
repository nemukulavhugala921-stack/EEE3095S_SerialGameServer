<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Title & Metadata -->
  <text x="550" y="38" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">EEE3095S Hardware Circuit Schematic &amp; Interface Diagram</text>
  <text x="550" y="58" font-size="12" fill="#64748b" text-anchor="middle">UCT STM32F051 Development Board (LQFP-48) &amp; Host USB Interconnection</text>

  <!-- ==================== HOST PC BLOCK ==================== -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="180" height="260" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2" />
    <text x="90" y="32" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">HOST PC</text>
    <line x1="20" y1="44" x2="160" y2="44" stroke="#cbd5e1" stroke-width="1.5" />
    
    <rect x="25" y="70" width="130" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="90" y="96" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Python Client</text>
    <text x="90" y="114" font-size="11" fill="#475569" text-anchor="middle">(PySerial / GUI)</text>

    <rect x="25" y="160" width="130" height="50" rx="6" fill="#fed7aa" stroke="#f97316" />
    <text x="90" y="185" font-size="12" font-weight="600" fill="#7c2d12" text-anchor="middle">USB Controller</text>
    <text x="90" y="200" font-size="10" fill="#9a3412" text-anchor="middle">Virtual COM (COM9)</text>
  </g>

  <!-- USB Cable Bus -->
  <line x1="220" y1="185" x2="310" y2="185" stroke="#f97316" stroke-width="4" />
  <text x="265" y="172" font-size="11" font-weight="600" fill="#ea580c" text-anchor="middle">USB Cable</text>
  <text x="265" y="205" font-size="10" fill="#64748b" text-anchor="middle">5V, D+, D-, GND</text>

  <!-- ==================== ONBOARD ST-LINK / VCP BLOCK ==================== -->
  <g transform="translate(310, 110)" filter="url(#shadow)">
    <rect width="160" height="260" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="80" y="30" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Onboard ST-Link V2</text>
    <text x="80" y="46" font-size="11" fill="#3b82f6" text-anchor="middle">(STM32F103 VCP)</text>
    <line x1="15" y1="56" x2="145" y2="56" stroke="#bfdbfe" stroke-width="1.5" />

    <text x="80" y="100" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">USB-to-UART</text>
    <text x="80" y="116" font-size="10" fill="#3b82f6" text-anchor="middle">Bridge Function</text>
    
    <!-- ST-Link Pins -->
    <rect x="110" y="165" width="45" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" />
    <text x="132" y="180" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">VCP_RX</text>

    <rect x="110" y="225" width="45" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" />
    <text x="132" y="240" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">VCP_TX</text>
  </g>

  <!-- USART1 Interconnects -->
  <!-- TX line: PA9 -> VCP_RX -->
  <path d="M 580 176 L 476 176" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" fill="none" />
  <text x="528" y="168" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">USART1_TX (115200 8N1)</text>

  <!-- RX line: VCP_TX -> PA10 -->
  <path d="M 470 236 L 574 236" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <text x="528" y="228" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">USART1_RX (115200 8N1)</text>

  <!-- ==================== STM32F051 MAIN MCU BLOCK ==================== -->
  <g transform="translate(580, 90)" filter="url(#shadow)">
    <rect width="240" height="490" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5" />
    <text x="120" y="32" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">STM32F051C8T6</text>
    <text x="120" y="48" font-size="11" fill="#475569" text-anchor="middle">ARM Cortex-M0 @ 48 MHz (LQFP-48)</text>
    <line x1="20" y1="58" x2="220" y2="58" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Left Pin Labels -->
    <text x="12" y="90" font-size="11" font-weight="700" fill="#2563eb">PA9 (AF1)</text>
    <text x="12" y="150" font-size="11" font-weight="700" fill="#16a34a">PA10 (AF1)</text>

    <!-- PA0 Button Pin -->
    <text x="12" y="330" font-size="11" font-weight="700" fill="#b45309">PA0 (GPIO_IN)</text>
    <text x="12" y="345" font-size="9" fill="#78350f">Pull-up (40kΩ)</text>

    <!-- Right Pin Labels -->
    <text x="228" y="120" font-size="11" font-weight="700" fill="#dc2626" text-anchor="end">PB10 (GPIO_OUT)</text>
    <text x="228" y="200" font-size="11" font-weight="700" fill="#16a34a" text-anchor="end">PB11 (GPIO_OUT)</text>
    <text x="228" y="280" font-size="11" font-weight="700" fill="#0284c7" text-anchor="end">PB0 (GPIO_OUT)</text>

    <!-- Internal Pull-up schematic snippet on PA0 -->
    <g transform="translate(85, 290)">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#94a3b8" stroke-width="1.5" />
      <text x="0" y="-5" font-size="9" font-weight="600" fill="#dc2626" text-anchor="middle">+3.3V (VDD)</text>
      <!-- Resistor symbol -->
      <rect x="-8" y="15" width="16" height="30" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
      <text x="0" y="34" font-size="8" fill="#64748b" text-anchor="middle">40k</text>
      <line x1="0" y1="45" x2="0" y2="55" stroke="#94a3b8" stroke-width="1.5" />
      <circle cx="0" cy="55" r="3" fill="#0f172a" />
      <line x1="0" y1="55" x2="-80" y2="55" stroke="#b45309" stroke-width="1.5" />
      <text x="22" y="58" font-size="8" fill="#475569">Internal</text>
    </g>
  </g>

  <!-- ==================== SW0 BUTTON CIRCUIT ==================== -->
  <g transform="translate(500, 420)">
    <!-- Trace from PA0 to Button -->
    <line x1="80" y1="15" x2="20" y2="15" stroke="#b45309" stroke-width="2" />
    <circle cx="20" cy="15" r="3" fill="#b45309" />
    <line x1="20" y1="15" x2="20" y2="40" stroke="#b45309" stroke-width="2" />
    
    <!-- Button switch symbol -->
    <circle cx="20" cy="45" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="20" cy="75" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <line x1="12" y1="42" x2="30" y2="60" stroke="#0f172a" stroke-width="2" />
    <text x="-4" y="60" font-size="11" font-weight="700" fill="#0f172a">SW0</text>
    
    <!-- Ground connection -->
    <line x1="20" y1="78" x2="20" y2="95" stroke="#0f172a" stroke-width="2" />
    <line x1="10" y1="95" x2="30" y2="95" stroke="#0f172a" stroke-width="2" />
    <line x1="13" y1="100" x2="27" y2="100" stroke="#0f172a" stroke-width="1.5" />
    <line x1="16" y1="105" x2="24" y2="105" stroke="#0f172a" stroke-width="1" />
    <text x="20" y="120" font-size="10" fill="#475569" text-anchor="middle">GND</text>
    <text x="-35" y="140" font-size="10" font-style="italic" fill="#78350f">Debounced 50 ms in HW</text>
  </g>

  <!-- ==================== OUTPUT STATUS LEDS ==================== -->

  <!-- 1. RED LED (Player X Turn / Win) - PB10 -->
  <g transform="translate(820, 200)">
    <!-- Wire from PB10 -->
    <line x1="0" y1="10" x2="40" y2="10" stroke="#dc2626" stroke-width="2" />
    
    <!-- 330 Ohm Resistor -->
    <rect x="40" y="0" width="45" height="20" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <text x="62" y="14" font-size="10" font-weight="600" fill="#dc2626" text-anchor="middle">330 Ω</text>
    
    <!-- Wire to Diode -->
    <line x1="85" y1="10" x2="125" y2="10" stroke="#dc2626" stroke-width="2" />

    <!-- LED Symbol -->
    <polygon points="125,0 125,20 145,10" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <line x1="145" y1="0" x2="145" y2="20" stroke="#dc2626" stroke-width="2" />
    <!-- Optical rays -->
    <line x1="135" y1="-2" x2="145" y2="-12" stroke="#dc2626" stroke-width="1.5" />
    <line x1="142" y1="-2" x2="152" y2="-12" stroke="#dc2626" stroke-width="1.5" />

    <!-- Ground Wire -->
    <line x1="145" y1="10" x2="185" y2="10" stroke="#0f172a" stroke-width="2" />
    <line x1="185" y1="10" x2="185" y2="30" stroke="#0f172a" stroke-width="2" />
    <!-- GND symbol -->
    <line x1="175" y1="30" x2="195" y2="30" stroke="#0f172a" stroke-width="2" />
    <line x1="178" y1="35" x2="192" y2="35" stroke="#0f172a" stroke-width="1.5" />
    <line x1="181" y1="40" x2="189" y2="40" stroke="#0f172a" stroke-width="1" />

    <!-- Description Label -->
    <text x="210" y="8" font-size="12" font-weight="700" fill="#991b1b">Red Status LED</text>
    <text x="210" y="24" font-size="10" fill="#64748b">Player X Turn / Win (PB10)</text>
    <text x="210" y="38" font-size="9" fill="#94a3b8">I_f ≈ 3.94 mA</text>
  </g>

  <!-- 2. GREEN LED (Player O Turn / Win) - PB11 -->
  <g transform="translate(820, 280)">
    <!-- Wire from PB11 -->
    <line x1="0" y1="10" x2="40" y2="10" stroke="#16a34a" stroke-width="2" />
    
    <!-- 330 Ohm Resistor -->
    <rect x="40" y="0" width="45" height="20" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <text x="62" y="14" font-size="10" font-weight="600" fill="#16a34a" text-anchor="middle">330 Ω</text>
    
    <!-- Wire to Diode -->
    <line x1="85" y1="10" x2="125" y2="10" stroke="#16a34a" stroke-width="2" />

    <!-- LED Symbol -->
    <polygon points="125,0 125,20 145,10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <line x1="145" y1="0" x2="145" y2="20" stroke="#16a34a" stroke-width="2" />
    <!-- Optical rays -->
    <line x1="135" y1="-2" x2="145" y2="-12" stroke="#16a34a" stroke-width="1.5" />
    <line x1="142" y1="-2" x2="152" y2="-12" stroke="#16a34a" stroke-width="1.5" />

    <!-- Ground Wire -->
    <line x1="145" y1="10" x2="185" y2="10" stroke="#0f172a" stroke-width="2" />
    <line x1="185" y1="10" x2="185" y2="30" stroke="#0f172a" stroke-width="2" />
    <!-- GND symbol -->
    <line x1="175" y1="30" x2="195" y2="30" stroke="#0f172a" stroke-width="2" />
    <line x1="178" y1="35" x2="192" y2="35" stroke="#0f172a" stroke-width="1.5" />
    <line x1="181" y1="40" x2="189" y2="40" stroke="#0f172a" stroke-width="1" />

    <!-- Description Label -->
    <text x="210" y="8" font-size="12" font-weight="700" fill="#166534">Green Status LED</text>
    <text x="210" y="24" font-size="10" fill="#64748b">Player O Turn / Win (PB11)</text>
    <text x="210" y="38" font-size="9" fill="#94a3b8">I_f ≈ 3.94 mA</text>
  </g>

  <!-- 3. DATA LED (Activity / Heartbeat D0) - PB0 -->
  <g transform="translate(820, 360)">
    <!-- Wire from PB0 -->
    <line x1="0" y1="10" x2="40" y2="10" stroke="#0284c7" stroke-width="2" />
    
    <!-- 330 Ohm Resistor -->
    <rect x="40" y="0" width="45" height="20" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <text x="62" y="14" font-size="10" font-weight="600" fill="#0284c7" text-anchor="middle">330 Ω</text>
    
    <!-- Wire to Diode -->
    <line x1="85" y1="10" x2="125" y2="10" stroke="#0284c7" stroke-width="2" />

    <!-- LED Symbol -->
    <polygon points="125,0 125,20 145,10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <line x1="145" y1="0" x2="145" y2="20" stroke="#0284c7" stroke-width="2" />
    <!-- Optical rays -->
    <line x1="135" y1="-2" x2="145" y2="-12" stroke="#0284c7" stroke-width="1.5" />
    <line x1="142" y1="-2" x2="152" y2="-12" stroke="#0284c7" stroke-width="1.5" />

    <!-- Ground Wire -->
    <line x1="145" y1="10" x2="185" y2="10" stroke="#0f172a" stroke-width="2" />
    <line x1="185" y1="10" x2="185" y2="30" stroke="#0f172a" stroke-width="2" />
    <!-- GND symbol -->
    <line x1="175" y1="30" x2="195" y2="30" stroke="#0f172a" stroke-width="2" />
    <line x1="178" y1="35" x2="192" y2="35" stroke="#0f172a" stroke-width="1.5" />
    <line x1="181" y1="40" x2="189" y2="40" stroke="#0f172a" stroke-width="1" />

    <!-- Description Label -->
    <text x="210" y="8" font-size="12" font-weight="700" fill="#0369a1">Data / Activity LED (D0)</text>
    <text x="210" y="24" font-size="10" fill="#64748b">Packet RX/TX Monitor (PB0)</text>
    <text x="210" y="38" font-size="9" fill="#94a3b8">I_f ≈ 3.94 mA</text>
  </g>

  <!-- Power Note Box -->
  <g transform="translate(60, 480)">
    <rect width="410" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="15" y="24" font-size="11" font-weight="700" fill="#334155">Power Distribution &amp; Electrical Limits:</text>
    <text x="15" y="42" font-size="10" fill="#475569">• VDD = +3.3 V regulated on-board from USB 5.0 V via LDO</text>
    <text x="15" y="58" font-size="10" fill="#475569">• GPIO Current: I = (3.3V - 2.0V) / 330Ω = 3.94 mA per LED (safe &lt; 25 mA limit)</text>
    <text x="15" y="74" font-size="10" fill="#475569">• Decoupling: 0.1 µF ceramic MLCC capacitors on all VDD/VDDA pins</text>
  </g>

</svg>
